<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 4</title>
    <link rel="stylesheet" href="Practica4.css">
</head>
<body>
    <form name="formulario" method="post">
        <h1>Datos personales</h1><br>
        Nombre:
        <input type="text" name="Nombre"><br>
        Apellidos:
        <input type="text" name="Apellidos"><br>
        DNI:
        <input type="number" name="DNI"><br>
        Fecha de nacimiento:
        <input type="date" name="Fecha de nacimiento"><br>

        <h1>Contacto</h1><br>
        Email:
        <input type="email" name="Email" placeholder="nombre@dominio.com"><br>
        Teléfono:
        <input type="tel" name="Teléfono" placeholder="+XX XXX XXXXXX"><br>
        Dirección:
        <input type="text" name="Dirección"><br>
        Localidad:
        <input type="text" name="Localidad"><br>
        Provincia:
        <input type="text" name="Provincia"><br>

        <h1>Curso</h1><br>
        Selecciona curso:
         <select>
              <option value="1">1DAM (Mañana)</option>
              <option value="2">1DAM (Tarde)</option>
              <option value="3">2DAM</option>
         </select>







     <input type="submit">
    </form>


    
</body>
</html>
